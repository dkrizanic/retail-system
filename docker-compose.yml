services:
  mongodb:
    image: mongo:8.0
    container_name: shopping-cart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shopping-cart-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping-cart-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/shopping_cart_db?connectTimeoutMS=3000&socketTimeoutMS=5000&serverSelectionTimeoutMS=3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
