services:
  mongodb:
    image: mongo:8.0
    container_name: shopping-cart-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  shopping-cart-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping-cart-service
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/shopping_cart_db
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
